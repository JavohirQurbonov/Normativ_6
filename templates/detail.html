{% block content %}
<i><a href="{% url 'product_list' %}">Home</a></i>

<h2>Title:{{ book.title }}</h2>
<p>Author:{{ book.author }}</p>

<button type="submit"><a href="{% url 'update' book.pk %}">Update</a></button>
<button><a href="{% url 'delete' book.pk%}">Delete</a></button>

{% endblock%}
